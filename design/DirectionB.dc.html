<div style="width: 1280px; height: 900px; background: #0E1116; font-family: 'Noto Sans TC', system-ui, sans-serif; color: #E6E9EF; box-sizing: border-box; display: flex; flex-direction: column;">

  <div style="padding: 24px 28px; display: flex; flex-direction: column; gap: 18px;">

        <span style="text-align: right; font-family: 'JetBrains Mono', monospace; font-size: 13px;">4</span>
